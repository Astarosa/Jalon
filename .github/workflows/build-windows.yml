name: Installeur Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/local/src-tauri -> target" }
      - run: npm ci
      - name: Construction de l'installeur
        working-directory: apps/local
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Jalon-installeur-windows
          path: apps/local/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publication (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/local/src-tauri/target/release/bundle/nsis/*.exe
