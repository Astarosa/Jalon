[package]
name = "jalon"
version = "1.2.1"
description = "Jalon — suivi de chantier, édition locale pour conducteur de travaux"
edition = "2021"
publish = false

[lib]
name = "jalon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chantier-store = { path = "../../../crates/store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
