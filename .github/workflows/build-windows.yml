name: Installeur Windows

# - push sur main / PR          : tests + installeur de test (artefact, non publié)
# - Actions > Run workflow,
#   case « Publier » cochée       : publie la version de tauri.conf.json (crée le tag vX.Y.Z)
# - tag vX.Y.Z poussé / release  : même publication
# La publication produit l'installeur signé et latest.json, que l'application consulte pour se mettre à jour.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier la version (crée le tag et la release à partir de tauri.conf.json)"
        type: boolean
        default: false
      notes:
        description: "Nouveautés affichées dans l'application (une par ligne, séparées par \\n si besoin)"
        type: string
        default: ""

permissions:
  contents: write

env:
  # Numéro de build affiché dans l'application : « version (build) »
  JALON_BUILD: ${{ github.run_number }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publier }}
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/local/src-tauri -> target" }
      - run: npm ci
      - name: Construction de l'installeur
        working-directory: apps/local
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Jalon-installeur-windows
          path: apps/local/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publier }}
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/local/src-tauri -> target" }
      - run: npm ci

      - name: Contrôles avant publication
        id: version
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./apps/local/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            [ "$TAG" = "v$V" ] || { echo "::error::Le tag $TAG ne correspond pas à la version $V de tauri.conf.json (npm run version:set)"; exit 1; }
          else
            TAG="v$V"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::La version $V est déjà publiée (tag $TAG). Augmentez la version : npm run version:set -- X.Y.Z"; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PUB=$(node -p "require('./apps/local/src-tauri/tauri.conf.json').plugins.updater.pubkey")
          [ -n "$PUB" ] || { echo "::error::Clé publique absente de tauri.conf.json (plugins.updater.pubkey)"; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::Secret de dépôt TAURI_SIGNING_PRIVATE_KEY manquant (voir README)"; exit 1; }
          # Publication : génère aussi les fichiers de mise à jour signés (.sig) et latest.json
          node -e "require('fs').writeFileSync('apps/local/src-tauri/tauri.release.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:true}}))"

      - name: Notes de version
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          # Priorité : saisie du bouton « Run workflow », puis texte d'une release créée sur GitHub,
          # puis message d'un tag annoté.
          BODY=$(printf '%b' "$INPUT_NOTES")
          [ -n "$BODY" ] || BODY=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          if [ -z "$BODY" ] && [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = "tag" ]; then
            BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP/,$d')
          fi
          [ -n "$BODY" ] || BODY="Jalon $TAG"
          { echo "body<<FIN_NOTES"; echo "$BODY"; echo "FIN_NOTES"; } >> "$GITHUB_OUTPUT"

      - name: Construction, signature et publication
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/local
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Jalon ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config ${{ github.workspace }}/apps/local/src-tauri/tauri.release.conf.json
